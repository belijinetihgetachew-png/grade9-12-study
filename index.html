<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f1f5f9;
  color:#172033;
}

/* ===== HEADER ===== */
header{
  background:linear-gradient(135deg,#063b91,#0875e1);
  color:white;
  padding:22px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}

header h1{
  margin:0;
  font-size:25px;
  font-weight:800;
  letter-spacing:.3px;
}

.menu-btn{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.3);
  color:white;
  font-size:25px;
  width:45px;
  height:45px;
  border-radius:12px;
  cursor:pointer;
}

/* ===== MAIN ===== */
.container{
  max-width:650px;
  margin:0 auto;
  padding:18px 15px 30px;
}

.card{
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 7px 25px rgba(15,23,42,.08);
  margin-bottom:18px;
  border:1px solid #e7edf5;
}

h2{
  color:#0755b5;
  margin-top:0;
  font-size:23px;
}

h3{
  color:#123b73;
}

/* ===== SOCIAL ===== */
.social-section{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.social-btn{
  flex:1;
  padding:14px 8px;
  text-align:center;
  color:white;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.telegram-btn{
  background:#159bd7;
}

.tiktok-btn{
  background:#111827;
}

/* ===== INVITE ===== */
.invite-box{
  background:linear-gradient(135deg,#e8f4ff,#f4faff);
  border:1px solid #b8ddff;
  padding:20px;
  border-radius:18px;
  margin-bottom:18px;
  text-align:center;
}

.invite-box h3{
  margin:0 0 8px;
  color:#0755b5;
}

.invite-btn{
  background:linear-gradient(135deg,#0566d6,#0b8cf2);
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
  box-shadow:0 5px 12px rgba(0,100,220,.25);
}

/* ===== GRADE GRID ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:15px;
}

.btn-card{
  background:linear-gradient(145deg,#ffffff,#f5f9ff);
  border:1px solid #d9e6f5;
  border-radius:17px;
  padding:19px 12px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 4px 12px rgba(30,64,175,.06);
}

.btn-card:hover{
  transform:translateY(-2px);
  border-color:#1677df;
  background:#eff7ff;
}

.btn-card h3{
  margin:0;
  color:#0864c7;
  font-size:17px;
}

.btn-card p{
  margin:7px 0 0;
  font-size:13px;
  color:#64748b;
}

/* ===== SUBJECT / LIST ===== */
.list-btn{
  display:block;
  width:100%;
  padding:15px;
  margin-bottom:11px;
  background:white;
  border:1px solid #d7e3f0;
  color:#1455a0;
  border-radius:13px;
  font-weight:bold;
  text-align:left;
  cursor:pointer;
  box-shadow:0 3px 9px rgba(15,23,42,.05);
  transition:.2s;
}

.list-btn:hover{
  background:#0867d7;
  color:white;
  border-color:#0867d7;
  transform:translateX(2px);
}

/* ===== PRICE ===== */
.price-badge{
  float:right;
  background:#e7f8ed;
  color:#16803d;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

/* ===== BACK ===== */
.btn-back{
  background:#64748b;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:16px;
}

/* ===== INPUTS ===== */
input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #d5deea;
  border-radius:11px;
  background:#f8fafc;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#1680e8;
  background:white;
  box-shadow:0 0 0 3px rgba(22,128,232,.1);
}

/* ===== SUBMIT ===== */
.btn-submit{
  background:linear-gradient(135deg,#0757c7,#0788ed);
  color:white;
  border:none;
  width:100%;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
  box-shadow:0 5px 14px rgba(0,90,210,.25);
}

/* ===== TELEBIRR ===== */
.telebirr-box{
  background:linear-gradient(135deg,#fffbe5,#fff8ce);
  border:1px solid #f4dc72;
  padding:17px;
  border-radius:13px;
  margin:15px 0;
}

.telebirr-box h3{
  color:#d97706 !important;
  font-size:22px;
}

/* ===== MENU ===== */
.menu-drawer{
  position:fixed;
  top:0;
  right:-290px;
  width:270px;
  height:100%;
  background:white;
  box-shadow:-5px 0 25px rgba(0,0,0,.18);
  transition:.3s;
  z-index:1000;
  padding:22px;
}

.menu-drawer.open{
  right:0;
}

.menu-item{
  display:block;
  width:100%;
  padding:15px 5px;
  border-bottom:1px solid #edf1f5;
  color:#173b6d;
  text-decoration:none;
  font-size:15px;
  cursor:pointer;
  text-align:left;
  background:none;
}

.menu-item:hover{
  color:#0875df;
}

.close-menu{
  background:#eef4fb;
  color:#17477d;
  border:none;
  padding:9px 12px;
  border-radius:9px;
  cursor:pointer;
  float:right;
}

/* ===== HIDDEN ===== */
.hidden{
  display:none;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  color:#64748b;
  padding:25px 15px;
  font-size:13px;
  background:#eef3f8;
}

/* ===== MOBILE ===== */
@media(max-width:430px){
  header h1{
    font-size:22px;
  }

  .container{
    padding:14px 12px 25px;
  }

  .card{
    padding:18px;
    border-radius:18px;
  }

  .grid{
    gap:10px;
  }

  .btn-card{
    padding:16px 8px;
  }
}
  </style>
